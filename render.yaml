services:
  - type: web
    name: bitehour-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
